<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapScale</title><style>body{font-family:system-ui;background:#0b0d10;color:#fff;margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#151920;border:1px solid #2b313c;border-radius:18px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #343b47;background:#0e1218;color:#fff;box-sizing:border-box}button{background:#ffd21f;color:#111;font-weight:800;border:0}.muted{color:#9ba3ae}.hidden{display:none}h1{margin-bottom:4px}</style></head><body><div class="wrap"><h1>SnapScale</h1><p class="muted">Advanced Photo Resize • Effects • Cloud Account</p><div id="auth" class="grid"><div class="card"><h2>Public Login</h2><input id="lemail" placeholder="Email"><input id="lpass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lmsg" class="muted"></p></div><div class="card"><h2>Create Account</h2><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+)"><button onclick="register()">Register</button><p id="rmsg" class="muted"></p></div></div><div id="dash" class="card hidden"><h2>Account Dashboard</h2><p id="who"></p><button onclick="logout()">Logout</button><div id="admin" class="hidden"><h2>Admin Panel</h2><p id="stats"></p><button onclick="users()">Load Users</button><pre id="users"></pre></div></div></div><script>const A=location.origin;const token=()=>localStorage.token;async function api(p,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json",...(token()?{Authorization:"Bearer "+token()}:{})};let r=await fetch(A+p,o),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:lemail.value,password:lpass.value})});localStorage.token=d.token;show(d.user)}catch(e){lmsg.textContent=e.message}}async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:pass.value})});localStorage.token=d.token;show(d.user)}catch(e){rmsg.textContent=e.message}}async function show(u){auth.classList.add('hidden');dash.classList.remove('hidden');who.textContent='Logged in: '+u.name+' • '+u.email+' • '+u.role;if(u.role==='admin'){admin.classList.remove('hidden');let s=await api('/api/admin/stats');stats.textContent='Users: '+s.users+' | Admins: '+s.admins}}async function users(){document.querySelector('#users').textContent=JSON.stringify(await api('/api/admin/users'),null,2)}function logout(){localStorage.removeItem('token');location.reload()}if(token())api('/api/me').then(x=>show(x.user)).catch(()=>localStorage.removeItem('token'));</script></body></html>
