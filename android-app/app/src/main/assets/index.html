<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapScale</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}header{padding:18px;text-align:center;border-bottom:1px solid #252a32}.app{max-width:900px;margin:auto;padding:18px}.drop{border:2px dashed #59616e;border-radius:22px;padding:38px;text-align:center}.card{background:#151920;border:1px solid #282e38;border-radius:18px;padding:15px;margin-top:15px}.preview{text-align:center;min-height:250px}.preview img{max-width:100%;max-height:55vh;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:13px;color:#aeb6c2;margin:8px 0 5px}.field input,.field select,button{width:100%;padding:10px;border-radius:10px;border:1px solid #303743;background:#0e1218;color:#fff}button{background:#ffd21f;color:#111;font-weight:800;border:0;margin-top:8px}.secondary{background:#29303a;color:#fff}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.filters button{background:#29303a;color:#fff;font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none}.info{color:#929aa7;font-size:12px}.badge{font-size:11px;background:#ffd21f;color:#111;padding:4px 8px;border-radius:20px}</style></head><body><header><strong>SnapScale</strong> <span class="badge">FREE</span></header><main class="app"><div id="drop" class="drop"><div style="font-size:44px">📷</div><h2>Photo Resize & Effects</h2><p class="info">Resize, compress and edit on your phone.</p><button onclick="file.click()">Choose Photo</button><input id="file" class="hidden" type="file" accept="image/*"></div><div id="editor" class="hidden"><div class="card preview"><img id="img" class="hidden"></div><div class="card"><div class="grid"><div class="field"><label>Width (px)</label><input id="w" type="number"></div><div class="field"><label>Height (px)</label><input id="h" type="number"></div></div><label class="info"><input id="lock" type="checkbox" checked> Lock aspect ratio</label><div class="field"><label>Brightness</label><input id="brightness" type="range" min="0" max="200" value="100"></div><div class="field"><label>Contrast</label><input id="contrast" type="range" min="0" max="200" value="100"></div><div class="field"><label>Saturation</label><input id="saturation" type="range" min="0" max="200" value="100"></div><div class="field"><label>Blur</label><input id="blur" type="range" min="0" max="10" value="0"></div><div class="filters"><button data-f="">Original</button><button data-f="grayscale(1)">B&W</button><button data-f="sepia(.5)">Vintage</button><button data-f="sepia(.2) saturate(1.3)">Warm</button><button data-f="hue-rotate(20deg)">Cool</button><button data-f="contrast(1.15) saturate(1.15)">Cinematic</button></div><div class="row"><button id="rotate" class="secondary">Rotate</button><button id="flip" class="secondary">Flip</button></div><div class="grid"><div class="field"><label>Format</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div class="field"><label>Quality</label><input id="quality" type="range" min="10" max="100" value="92"></div></div><button id="download">Download Photo</button><button id="reset" class="secondary">Reset</button></div></div></main><script>const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)],file=$('#file'),img=$('#img'),editor=$('#editor'),drop=$('#drop'),c=document.createElement('canvas'),ctx=c.getContext('2d');let src,ow,oh,rot=0,flip=false,extra='';file.onchange=e=>load(e.target.files[0]);function load(f){if(!f)return;let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{src=i;ow=i.width;oh=i.height;$('#w').value=ow;$('#h').value=oh;editor.classList.remove('hidden');render()};i.src=r.result};r.readAsDataURL(f)}function filter(){return 'brightness('+$('#brightness').value+'%) contrast('+$('#contrast').value+'%) saturate('+$('#saturation').value+'%) blur('+$('#blur').value+'px) '+extra}function render(){if(!src)return;let w=+$('#w').value||ow,h=+$('#h').value||oh;c.width=w;c.height=h;ctx.save();ctx.translate(w/2,h/2);ctx.rotate(rot*Math.PI/180);ctx.scale(flip?-1:1,1);ctx.filter=filter();ctx.drawImage(src,-w/2,-h/2,w,h);ctx.restore();img.src=c.toDataURL('image/jpeg',.9);img.classList.remove('hidden')}$('#w').oninput=()=>{if($('#lock').checked)$('#h').value=Math.round($('#w').value*oh/ow);render()};$('#h').oninput=()=>{if($('#lock').checked)$('#w').value=Math.round($('#h').value*ow/oh);render()};['brightness','contrast','saturation','blur'].forEach(id=>$('#'+id).oninput=render);$$('[data-f]').forEach(b=>b.onclick=()=>{extra=b.dataset.f;render()});$('#rotate').onclick=()=>{rot=(rot+90)%360;render()};$('#flip').onclick=()=>{flip=!flip;render()};$('#reset').onclick=()=>{['brightness','contrast','saturation'].forEach(x=>$('#'+x).value=100);$('#blur').value=0;extra='';rot=0;flip=false;render()};$('#download').onclick=()=>{let type=$('#format').value,q=$('#quality').value/100;c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='snapscale-photo.'+(type==='image/png'?'png':type==='image/webp'?'webp':'jpg');a.click()},type,q)}</script></body></html>
