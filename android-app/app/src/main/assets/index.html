<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapScale Pro</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui}.app{max-width:900px;margin:auto;padding:16px}.card,.drop{background:#151920;border:1px solid #2b313c;border-radius:18px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343b47;background:#0e1218;color:#fff;margin:5px 0}button{background:#ffd21f;color:#111;font-weight:800;border:0}.secondary{background:#29303a;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.filters button{background:#29303a;color:#fff;font-size:12px}.preview{text-align:center;min-height:230px}.preview img{max-width:100%;max-height:52vh;border-radius:12px}.hidden{display:none}.muted{color:#9aa3af;font-size:13px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#ffd21f;color:#111;padding:4px 8px;border-radius:20px;font-size:11px}</style></head><body><main class="app"><div class="top"><h2>SnapScale <span class="badge">PRO</span></h2><button id="logout" class="secondary hidden" style="width:auto">Logout</button></div><section id="auth"><div class="card"><h3>Public Login</h3><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lm" class="muted"></p></div><div class="card"><h3>Create Public Account</h3><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (6+)"><button onclick="reg()">Create Account</button><p id="rm" class="muted"></p></div></section><section id="app" class="hidden"><div class="drop"><b>📷 Choose Photo</b><input id="file" type="file" accept="image/*"></div><div class="card preview"><img id="img" class="hidden"></div><div class="card"><div class="grid"><label>Width<input id="w" type="number"></label><label>Height<input id="h" type="number"></label></div><label><input id="lock" type="checkbox" checked> Lock ratio</label><label>Brightness<input id="br" type="range" min="0" max="200" value="100"></label><label>Contrast<input id="co" type="range" min="0" max="200" value="100"></label><label>Saturation<input id="sa" type="range" min="0" max="200" value="100"></label><label>Blur<input id="bl" type="range" min="0" max="10" value="0"></label><div class="filters"><button data-f="">Original</button><button data-f="grayscale(1)">B&W</button><button data-f="sepia(.5)">Vintage</button><button data-f="sepia(.2) saturate(1.3)">Warm</button><button data-f="hue-rotate(20deg)">Cool</button><button data-f="contrast(1.15) saturate(1.15)">Cinematic</button></div><div class="grid"><button id="rot" class="secondary">Rotate</button><button id="flip" class="secondary">Flip</button></div><div class="grid"><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select><input id="q" type="range" min="10" max="100" value="92"></div><button id="save">Download Photo</button></div><div id="admin" class="card hidden"><h3>Admin Panel</h3><p id="stats" class="muted"></p><button onclick="loadUsers()">View Users</button><pre id="users" style="white-space:pre-wrap"></pre></div></section></main><script>const API='https://snapscale-api.onrender.com', $=x=>document.querySelector(x);async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(localStorage.token?{Authorization:'Bearer '+localStorage.token}:{})};let r=await fetch(API+p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Server error');return d}async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});localStorage.token=d.token;show(d.user)}catch(e){lm.textContent=e.message}}async function reg(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value})});localStorage.token=d.token;show(d.user)}catch(e){rm.textContent=e.message}}async function show(u){auth.classList.add('hidden');app.classList.remove('hidden');logout.classList.remove('hidden');if(u.role==='admin'){admin.classList.remove('hidden');let s=await api('/api/admin/stats');stats.textContent='Users: '+s.users+' • Admins: '+s.admins}}logout.onclick=()=>{localStorage.removeItem('token');location.reload()};if(localStorage.token)api('/api/me').then(x=>show(x.user)).catch(()=>localStorage.removeItem('token'));async function loadUsers(){users.textContent=JSON.stringify(await api('/api/admin/users'),null,2)}const file=$('#file'),img=$('#img'),c=document.createElement('canvas'),ctx=c.getContext('2d');let src,ow,oh,rot=0,flip=false,extra='';file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{src=i;ow=i.width;oh=i.height;w.value=ow;h.value=oh;img.classList.remove('hidden');render()};i.src=r.result};r.readAsDataURL(f)};function render(){if(!src)return;let W=+w.value||ow,H=+h.value||oh;c.width=W;c.height=H;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(rot*Math.PI/180);ctx.scale(flip?-1:1,1);ctx.filter='brightness('+br.value+'%) contrast('+co.value+'%) saturate('+sa.value+'%) blur('+bl.value+'px) '+extra;ctx.drawImage(src,-W/2,-H/2,W,H);ctx.restore();img.src=c.toDataURL('image/jpeg',.9)}w.oninput=()=>{if(lock.checked)h.value=Math.round(w.value*oh/ow);render()};h.oninput=()=>{if(lock.checked)w.value=Math.round(h.value*ow/oh);render()};[br,co,sa,bl].forEach(x=>x.oninput=render);document.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{extra=x.dataset.f;render()});rot.onclick=()=>{rot=(rot+90)%360;render()};flip.onclick=()=>{flip=!flip;render()};save.onclick=()=>{let t=fmt.value;c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='snapscale-photo.'+(t==='image/png'?'png':t==='image/webp'?'webp':'jpg');a.click()},t,q.value/100)};</script></body></html>
