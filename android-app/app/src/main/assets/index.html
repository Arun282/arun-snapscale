<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapScale</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial}header{padding:18px;display:flex;justify-content:space-between;border-bottom:1px solid #292e3b}.logo{color:#ffd21f;font-weight:800;font-size:22px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#131722;border:1px solid #292e3b;border-radius:18px;padding:18px;margin:14px 0}.drop{text-align:center;padding:45px;border:2px dashed #444;border-radius:15px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0e1118;color:#fff;margin:6px 0}button{background:#ffd21f;color:#111;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{max-width:100%;max-height:380px;display:block;margin:15px auto;border-radius:12px}.hide{display:none}</style></head><body><header><div class="logo">SnapScale</div><button style="width:auto" onclick="loginBox()">Login</button></header><main class="wrap"><div class="card"><div class="drop" onclick="file.click()">📷<br><b>Upload Photo</b><br><small>Resize • Enhance • Rotate • Download</small></div><input id="file" type="file" accept="image/*" class="hide"></div><div id="editor" class="card hide"><img id="preview" class="preview"><div class="grid"><input id="w" type="number" placeholder="Width"><input id="h" type="number" placeholder="Height"><input id="bright" type="range" min=".5" max="1.8" step=".05" value="1"><input id="contrast" type="range" min=".5" max="1.8" step=".05" value="1"><input id="sat" type="range" min="0" max="2" step=".05" value="1"><input id="blur" type="range" min="0" max="8" step=".5" value="0"></div><button onclick="rotate(-90)">↶ Rotate</button><button onclick="rotate(90)">↷ Rotate</button><button onclick="flip()">↔ Flip</button><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select><button onclick="downloadImage()">Download Photo</button></div></main><div id="login" class="hide" style="position:fixed;inset:0;background:#000c;padding:25px"><div class="card" style="max-width:420px;margin:50px auto"><h2>SnapScale Login</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><button onclick="doRegister()">Create Account</button><button onclick="closeLogin()">Close</button></div></div><canvas id="canvas" class="hide"></canvas><script>
const API="https://snapscale-api.onrender.com";let img=new Image(),angle=0,flipX=1;
function $(x){return document.getElementById(x)}$("file").onchange=function(e){let f=e.target.files[0];if(!f)return;img.onload=function(){$("preview").src=img.src;$("w").value=img.naturalWidth;$("h").value=img.naturalHeight;$("editor").classList.remove("hide")};img.src=URL.createObjectURL(f)};
function update(){if(!img.src)return;$("preview").style.filter="brightness("+$("bright").value+") contrast("+$("contrast").value+") saturate("+$("sat").value+") blur("+$("blur").value+"px)";$("preview").style.transform="rotate("+angle+"deg) scaleX("+flipX+")"}["bright","contrast","sat","blur"].forEach(function(x){$(x).oninput=update});
function rotate(x){angle=(angle+x+360)%360;update()}function flip(){flipX*=-1;update()}
function downloadImage(){let c=$("canvas"),w=+$("w").value||img.naturalWidth,h=+$("h").value||img.naturalHeight;c.width=w;c.height=h;let x=c.getContext("2d");x.save();x.translate(w/2,h/2);x.rotate(angle*Math.PI/180);x.scale(flipX,1);x.filter="brightness("+$("bright").value+") contrast("+$("contrast").value+") saturate("+$("sat").value+") blur("+$("blur").value+"px)";x.drawImage(img,-w/2,-h/2,w,h);x.restore();c.toBlob(function(b){let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="snapsacle."+($("format").value==="image/png"?"png":$("format").value==="image/webp"?"webp":"jpg");a.click()},$("format").value,.9)}
function loginBox(){$("login").classList.remove("hide")}function closeLogin(){$("login").classList.add("hide")}
async function doLogin(){let r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("pass").value})}),d=await r.json();if(d.token){localStorage.token=d.token;alert("Login successful");closeLogin()}else alert(d.error||"Login failed")}
async function doRegister(){let r=await fetch(API+"/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("pass").value,name:"SnapScale User"})}),d=await r.json();alert(d.ok?"Account created":d.error||"Registration failed")}
</script></body></html>
