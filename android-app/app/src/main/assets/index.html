<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapScale Pro</title><style>:root{--accent:#ffd21f;--bg:#0b0d10;--card:#151920;--text:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}.app{max-width:950px;margin:auto;padding:16px}.card,.drop{background:var(--card);border:1px solid #2b313c;border-radius:18px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343b47;background:#0e1218;color:#fff;margin:5px 0}button{background:var(--accent);color:#111;font-weight:800;border:0}.secondary{background:#29303a;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.filters button{background:#29303a;color:#fff;font-size:12px}.preview{text-align:center;min-height:230px}.preview img{max-width:100%;max-height:52vh;border-radius:12px}.hidden{display:none}.muted{color:#9aa3af;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:var(--accent);color:#111;padding:4px 8px;border-radius:20px;font-size:11px}.qr{max-width:230px;background:#fff;padding:8px;border-radius:12px;display:block;margin:10px auto}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#29303a;font-size:12px;margin:2px}.danger{background:#e74c3c;color:#fff}@media(max-width:600px){.three,.grid,.filters{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><h2 id="brand">SnapScale <span class="badge">PRO</span></h2><button id="logout" class="secondary hidden" style="width:auto">Logout</button></div><section id="auth"><div class="card"><h3>Public Login</h3><input id="le" placeholder="Email / Admin ID"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lm" class="muted"></p></div><div class="card"><h3>Create Public Account</h3><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (6+)"><button onclick="reg()">Create Account</button><p id="rm" class="muted"></p></div></section><section id="app" class="hidden"><div class="card"><h3 id="welcome">Welcome</h3><p id="purchaseState" class="muted"></p><button id="buy" onclick="openPay()">Purchase Pro</button></div><div id="pay" class="card hidden"><h3>Secure Purchase</h3><p id="priceText"></p><img id="qr" class="qr hidden"><p id="payDetails" class="muted"></p><input id="tid" placeholder="UPI Transaction ID / UTR"><button onclick="submitPayment()">I Have Paid</button><p id="payMsg" class="muted"></p></div><div class="drop"><b>📷 Choose Photo</b><input id="file" type="file" accept="image/*"></div><div class="card preview"><img id="img" class="hidden"></div><div class="card"><div class="grid"><label>Width<input id="w" type="number"></label><label>Height<input id="h" type="number"></label></div><label><input id="lock" type="checkbox" checked> Lock ratio</label><label>Brightness<input id="br" type="range" min="0" max="200" value="100"></label><label>Contrast<input id="co" type="range" min="0" max="200" value="100"></label><label>Saturation<input id="sa" type="range" min="0" max="200" value="100"></label><label>Blur<input id="bl" type="range" min="0" max="10" value="0"></label><div class="filters"><button data-f="">Original</button><button data-f="grayscale(1)">B&W</button><button data-f="sepia(.5)">Vintage</button><button data-f="sepia(.2) saturate(1.3)">Warm</button><button data-f="hue-rotate(20deg)">Cool</button><button data-f="contrast(1.15) saturate(1.15)">Cinematic</button></div><div class="grid"><button id="rot" class="secondary">Rotate</button><button id="flip" class="secondary">Flip</button></div><div class="grid"><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select><input id="q" type="range" min="10" max="100" value="92"></div><button id="save">Download Photo</button></div><div id="admin" class="card hidden"><h3>⚙️ Admin Control Center</h3><div class="three"><button onclick="adminTab('custom')">App Customization</button><button onclick="adminTab('payment')">Payment / Bank</button><button onclick="adminTab('users')">Users / Payments</button></div><div id="customTab"><h4>App Customization</h4><div class="grid"><label>App Name<input id="setName"></label><label>Pro Price (₹)<input id="setPrice" type="number"></label></div><div class="grid"><label>Theme<select id="setTheme"><option value="yellow">Yellow</option><option value="blue">Blue</option><option value="green">Green</option><option value="purple">Purple</option><option value="red">Red</option><option value="dark">Dark</option></select></label><label>Logo URL<input id="setLogo" placeholder="https://..."></label></div><label>Purchase Title<input id="setTitle"></label><button onclick="saveSettings()">Save Customization</button><p id="setMsg" class="muted"></p></div><div id="paymentTab" class="hidden"><h4>Where customer payments go</h4><input id="upi" placeholder="UPI ID (example@upi)"><input id="upiName" placeholder="UPI account name"><input id="qrUrl" placeholder="Optional QR image URL"><input id="bank" placeholder="Bank name"><input id="accName" placeholder="Account holder name"><input id="accNo" placeholder="Account number"><input id="ifsc" placeholder="IFSC"><button onclick="saveSettings()">Save Payment Details</button><p class="muted">Customers will see your configured UPI/QR details. Payment approval is manual using the UTR/transaction ID.</p></div><div id="usersTab" class="hidden"><button onclick="loadAdmin()">Refresh</button><p id="stats" class="muted"></p><pre id="users" style="white-space:pre-wrap;overflow:auto"></pre></div></div></section></main><script>const API='https://snapscale-api.onrender.com',$=x=>document.querySelector(x);let ME=null,CFG={};async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(localStorage.token?{Authorization:'Bearer '+localStorage.token}:{})};let r=await fetch(API+p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Server error');return d}async function cfg(){try{CFG=await api('/api/public/settings');applyTheme()}catch{}}function applyTheme(){let colors={yellow:'#ffd21f',blue:'#4da3ff',green:'#39d98a',purple:'#a78bfa',red:'#ff5c5c',dark:'#8b95a7'};document.documentElement.style.setProperty('--accent',colors[CFG.theme]||colors.yellow);brand.innerHTML=(CFG.appName||'SnapScale')+' <span class="badge">PRO</span>';document.title=CFG.appName||'SnapScale'}async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});localStorage.token=d.token;show(d.user)}catch(e){lm.textContent=e.message}}async function reg(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value})});localStorage.token=d.token;show(d.user)}catch(e){rm.textContent=e.message}}async function show(u){ME=u;auth.classList.add('hidden');app.classList.remove('hidden');logout.classList.remove('hidden');welcome.textContent='Welcome, '+u.name;if(u.purchase)purchaseState.textContent='Purchase status: '+u.purchase.status;else purchaseState.textContent='Free account • Pro purchase available';if(u.role==='admin'){admin.classList.remove('hidden');await loadSettingsAdmin()}}logout.onclick=()=>{localStorage.removeItem('token');location.reload()};async function openPay(){CFG=await api('/api/public/settings');priceText.textContent=(CFG.purchaseTitle||'SnapScale Pro')+' — ₹'+CFG.price;if(CFG.qrImage){qr.src=CFG.qrImage;qr.classList.remove('hidden')}else if(CFG.upiId){qr.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent('upi://pay?pa='+CFG.upiId+'&pn='+(CFG.upiName||CFG.appName)+'&am='+CFG.price+'&cu=INR');qr.classList.remove('hidden')}payDetails.textContent='UPI: '+(CFG.upiId||'Not configured')+' • Bank: '+(CFG.bankName||'Not configured')+' • A/c: '+(CFG.accountName||'')+' '+(CFG.accountNumber?'****'+CFG.accountNumber.slice(-4):'')+' • IFSC: '+(CFG.ifsc||'');pay.classList.remove('hidden')}async function submitPayment(){try{await api('/api/purchase',{method:'POST',body:JSON.stringify({transactionId:tid.value,amount:CFG.price})});payMsg.textContent='Payment submitted. Admin verification pending.';purchaseState.textContent='Purchase status: pending'}catch(e){payMsg.textContent=e.message}}function adminTab(x){customTab.classList.toggle('hidden',x!=='custom');paymentTab.classList.toggle('hidden',x!=='payment');usersTab.classList.toggle('hidden',x!=='users')}async function loadSettingsAdmin(){let s=await api('/api/admin/settings');setName.value=s.appName;setPrice.value=s.price;setTheme.value=s.theme;setLogo.value=s.logoUrl;setTitle.value=s.purchaseTitle;upi.value=s.upiId;upiName.value=s.upiName;qrUrl.value=s.qrImage;bank.value=s.bankName;accName.value=s.accountName;accNo.value=s.accountNumber;ifsc.value=s.ifsc;applyTheme()}async function saveSettings(){let x={appName:setName.value,price:+setPrice.value,theme:setTheme.value,logoUrl:setLogo.value,purchaseTitle:setTitle.value,upiId:upi.value,upiName:upiName.value,qrImage:qrUrl.value,bankName:bank.value,accountName:accName.value,accountNumber:accNo.value,ifsc:ifsc.value};try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(x)});CFG=x;applyTheme();setMsg.textContent='Saved successfully';}catch(e){setMsg.textContent=e.message}}async function loadAdmin(){try{let s=await api('/api/admin/stats'),u=await api('/api/admin/users'),p=await api('/api/admin/payments');stats.textContent='Users: '+s.users+' • Pending: '+s.pendingPayments+' • Approved: '+s.approvedPayments;users.textContent=JSON.stringify({users:u,payments:p},null,2)}catch(e){users.textContent=e.message}}const file=$('#file'),img=$('#img'),c=document.createElement('canvas'),ctx=c.getContext('2d');let src,ow,oh,rot=0,flip=false,extra='';file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{src=i;ow=i.width;oh=i.height;w.value=ow;h.value=oh;img.classList.remove('hidden');render()};i.src=r.result};r.readAsDataURL(f)};function render(){if(!src)return;let W=+w.value||ow,H=+h.value||oh;c.width=W;c.height=H;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(rot*Math.PI/180);ctx.scale(flip?-1:1,1);ctx.filter='brightness('+br.value+'%) contrast('+co.value+'%) saturate('+sa.value+'%) blur('+bl.value+'px) '+extra;ctx.drawImage(src,-W/2,-H/2,W,H);ctx.restore();img.src=c.toDataURL('image/jpeg',.9)}w.oninput=()=>{if(lock.checked)h.value=Math.round(w.value*oh/ow);render()};h.oninput=()=>{if(lock.checked)w.value=Math.round(h.value*ow/oh);render()};[br,co,sa,bl].forEach(x=>x.oninput=render);document.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{extra=x.dataset.f;render()});rot.onclick=()=>{rot=(rot+90)%360;render()};flip.onclick=()=>{flip=!flip;render()};save.onclick=()=>{let t=fmt.value;c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='snapscale-photo.'+(t==='image/png'?'png':t==='image/webp'?'webp':'jpg');a.click()},t,q.value/100)};cfg();if(localStorage.token)api('/api/me').then(x=>show(x.user)).catch(()=>localStorage.removeItem('token'));</script></body></html>
